<svg width="100%" viewBox="0 0 680 666" role="img" xmlns="http://www.w3.org/2000/svg">
<title>§1.3 Metodología General · PDCA aplicado al KPI Monthly Carrier Forecast Adherence · TFG Sánchez Pérez, Jaime</title>
<desc>Diagrama del ciclo PDCA (Plan-Do-Check-Act) aplicado al análisis y mejora del KPI logístico en AB InBev México</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── INPUT: Problema de partida ── -->
<rect x="160" y="20" width="360" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#444441">
  KPI Monthly Carrier Forecast Adherence · AB InBev México
</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">
  Modelo de seguimiento manual e insuficiente · 4 limitaciones operativas identificadas
</text>

<!-- flecha entrada -->
<line x1="340" y1="64" x2="340" y2="92" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── CONTENEDOR PRINCIPAL ── -->
<rect x="40" y="92" width="600" height="462" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="60" y="116" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#0C447C">
  §1.3 Metodología General · Ciclo de Mejora Continua PDCA
</text>
<text x="60" y="134" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#185FA5">
  Combina enfoque cuantitativo (análisis estadístico de datos) y cualitativo (validación operativa)
</text>

<!-- ── PLAN ── -->
<rect x="64" y="148" width="552" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="84" y="168" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#3C3489">
  ① PLAN · Diagnóstico y diseño de la solución
</text>
<text x="84" y="188" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#534AB7">
  4 limitaciones del modelo actual: reactivo, silos de datos, análisis mensual, sin distinción de causas
</text>
<text x="84" y="208" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#534AB7">
  Arquitectura ETL end-to-end: SAP → Python (Loading Forecast) → Power Query → modelo integrado
</text>

<!-- separador -->
<line x1="64" y1="236" x2="616" y2="236" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- ── DO ── -->
<rect x="64" y="244" width="552" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="84" y="264" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#085041">
  ② DO · Implementación del modelo de datos
</text>
<text x="84" y="284" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56">
  Extracción SAP (Monitor Loading) + scripts Python (Loading Forecast desde SharePoint)
</text>
<text x="84" y="302" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56">
  ETL Power Query: full outer join planificación + ejecución · unificación semántica naviera/puerto
</text>
<text x="84" y="320" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56">
  Lógica de hits: umbral 70 % · mínimo 10 contenedores · regla T10 (10 días de antelación)
</text>

<!-- separador -->
<line x1="64" y1="352" x2="616" y2="352" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- ── CHECK ── -->
<rect x="64" y="360" width="552" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="84" y="380" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#3C3489">
  ③ CHECK · Análisis de resultados
</text>
<text x="84" y="400" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#534AB7">
  Cuantitativo: ~200 hits identificados · concentración por naviera/país/periodo · causas raíz
</text>
<text x="84" y="420" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#534AB7">
  Cualitativo: validación operativa por responsable de país · triangulación de información
</text>

<!-- separador -->
<line x1="64" y1="448" x2="616" y2="448" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- ── ACT ── -->
<rect x="64" y="456" width="552" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="84" y="476" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#444441">
  ④ ACT · Propuestas de mejora e implementación
</text>
<text x="84" y="496" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">
  Estandarización de comentarios y clasificación de causas raíz por categorías comparables
</text>
<text x="84" y="516" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">
  Acciones correctoras en curso · capa de visualización Power BI como soporte a la decisión
</text>

<!-- flecha salida + nota ciclo -->
<line x1="340" y1="554" x2="340" y2="582" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text x="354" y="568" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#3D3D3A">
  ↺ ciclo continuo por periodo
</text>

<!-- ── OUTPUT: Resultado ── -->
<rect x="64" y="582" width="552" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="602" text-anchor="middle" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#085041">
  Modelo integrado de diagnóstico y mejora continua del KPI
</text>
<text x="340" y="622" text-anchor="middle" dominant-baseline="central"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56">
  Visibilidad semanal · diagnóstico proactivo de desviaciones · acciones documentadas y comparables
</text>

</svg>
