const CATEGORY_ORDER = ["Content", "Dev", "Agentic", "Code"];
const CATEGORY_ICON = { Content: "pen", Dev: "wrench", Agentic: "robot", Code: "diagram" };

/* ---------------------------------------------------------------------
   State & Browse view rendering engine
--------------------------------------------------------------------- */
let currentViewLayout = "flat";
let currentCategoryFilter = "all";
let currentSearchQuery = "";

function sortChronological(a, b) {
  return b.date.localeCompare(a.date) || a.name.localeCompare(b.name);
}

function createSkillCard(s) {
  const card = document.createElement("div");
  card.className = "skill-card";
  card.innerHTML = `
    <div class="card-meta">
      <span class="badge badge-cat">${s.category}</span>
      <span class="badge badge-date">${s.date}</span>
    </div>
    <h3>${s.name}</h3>
    <p>${s.desc}</p>
    <code class="path">${s.path}</code>
  `;
  return card;
}

function renderBrowse() {
  const root = document.getElementById("categories");
  root.innerHTML = "";
  const q = currentSearchQuery.trim().toLowerCase();

  const matchesSearch = s => !q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q);
  const matchesCat = s => currentCategoryFilter === "all" || s.category === currentCategoryFilter;

  if (currentViewLayout === "flat") {
    const entries = Object.values(SKILLS)
      .filter(s => matchesCat(s) && matchesSearch(s))
      .sort(sortChronological);

    if (entries.length === 0) {
      root.innerHTML = `<div class="empty-state">No skills found matching your filters.</div>`;
      return;
    }

    entries.forEach(s => {
      root.appendChild(createSkillCard(s));
    });
  } else {
    // Grouped by category layout
    let totalVisible = 0;
    CATEGORY_ORDER.forEach(cat => {
      if (currentCategoryFilter !== "all" && currentCategoryFilter !== cat) return;

      const entries = Object.values(SKILLS)
        .filter(s => s.category === cat && matchesSearch(s))
        .sort(sortChronological);

      if (entries.length > 0) {
        totalVisible += entries.length;
        const block = document.createElement("div");
        block.className = "category-block";

        const title = document.createElement("div");
        title.className = "category-title";
        title.innerHTML = `${iconSvg(CATEGORY_ICON[cat])}<span>${cat}</span>`;
        block.appendChild(title);

        entries.forEach(s => {
          block.appendChild(createSkillCard(s));
        });

        root.appendChild(block);
      }
    });

    if (totalVisible === 0) {
      root.innerHTML = `<div class="empty-state">No skills found matching your filters.</div>`;
    }
  }
}

document.getElementById("search").addEventListener("input", e => {
  currentSearchQuery = e.target.value;
  renderBrowse();
});

document.querySelectorAll(".layout-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".layout-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentViewLayout = btn.dataset.layout;
    renderBrowse();
  });
});

document.querySelectorAll(".cat-filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCategoryFilter = btn.dataset.category;
    renderBrowse();
  });
});

let treeHistory = ["start"];

function renderTree() {
  const nodeId = treeHistory[treeHistory.length - 1];
  const card = document.getElementById("tree-card");
  const crumbs = document.getElementById("breadcrumbs");

  // breadcrumbs
  if (treeHistory.length > 1) {
    crumbs.innerHTML = `<button id="back-btn">&larr; Back</button> · Step ${treeHistory.length}`;
    document.getElementById("back-btn").addEventListener("click", () => {
      treeHistory.pop();
      renderTree();
    });
  } else {
    crumbs.innerHTML = "";
  }

  if (nodeId.startsWith("result:")) {
    const skillKey = nodeId.slice(7);
    const s = SKILLS[skillKey];
    card.innerHTML = `
      <div class="tree-icon">${iconSvg(s.icon)}</div>
      <div class="result-skill">
        <h2>${s.name}</h2>
        <p class="desc">${s.desc}</p>
        <code class="path">${s.path}</code>
      </div>
      <div class="result-actions">
        <button id="restart-btn">Start over</button>
      </div>
    `;
    document.getElementById("restart-btn").addEventListener("click", () => {
      treeHistory = ["start"];
      renderTree();
    });
    return;
  }

  const node = TREE[nodeId];
  card.innerHTML = `
    <div class="tree-icon">${iconSvg(node.icon)}</div>
    <p class="tree-question">${node.question}</p>
    <div class="options"></div>
  `;
  const optionsRoot = card.querySelector(".options");
  node.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      if (opt.result) {
        treeHistory.push("result:" + opt.result);
      } else {
        treeHistory.push(opt.next);
      }
      renderTree();
    });
    optionsRoot.appendChild(btn);
  });
}

/* ---------------------------------------------------------------------
   Mode switching — browsing the flat list is the default; the tree is
   an optional alternate path, never required to find a skill.
--------------------------------------------------------------------- */
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const mode = btn.dataset.mode;
    document.getElementById("view-browse").classList.toggle("active", mode === "browse");
    document.getElementById("view-tree").classList.toggle("active", mode === "tree");
    if (mode === "tree") {
      treeHistory = ["start"];
      renderTree();
    }
  });
});
